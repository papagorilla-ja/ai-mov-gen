{% include "_partials/head.html" %}
<div class="slide-body-area">
  {% if canvas_id %}
  <div class="clip chart-canvas-wrap" data-seq="head" data-seq-offset="0.4" data-anim="rise">
    <canvas id="{{ canvas_id }}" width="{{ chart_w }}" height="{{ chart_h }}"></canvas>
  </div>
  <script>{{ chart_script }}</script>
  {% endif %}
</div>
